
name: Build LiquidGlassUI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Apply latest project ZIP
        run: |
          if [ ! -f LiquidGlassUI-Phase2-v0.3.zip ]; then
            echo "Phase 2 ZIP not found!"
            exit 1
          fi

          mkdir -p /tmp/liquidglassui
          unzip -oq LiquidGlassUI-Phase2-v0.3.zip -d /tmp/liquidglassui

          PROJECT_DIR=$(find /tmp/liquidglassui -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found inside ZIP!"
            exit 1
          fi

          cp -a "$PROJECT_DIR/." .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassUI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
